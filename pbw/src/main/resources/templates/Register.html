<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buat Akun Bingkai Sunyi</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <header class="navbar">
            <a href="#" class="navbar-brand">Bingkai Sunyi</a>
        </header>

        <main class="main-container">
            <div class="auth-wrapper">

            <div class="login-card">
                <div class="brand-label">BINGKAI SUNYI</div>
                <h1 class="login-title">Buat Akun Bingkai Sunyi</h1>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Alamat Email</label>
                        <input type="text" id="email" name="email" placeholder="Masukkan Email" required>
                    </div>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Masukkan Username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Masukkan Password" required>
                    </div>
                    <p class="helper-text">Gunakan minimal 8 karakter</p>

                    <div class="input-group">
                        <label for="confirm_password">Konfirmasi Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Masukkan ulang password" minlength="8" required>
                    </div>

                    <button type="submit" class="btn-submit">Daftar Akun</button>
                </form>

                <p class="switch-auth-text">
                    Sudah punya akun? <a href="Login.html">Masuk</a>
                </p>
            </div>

            <div class="photo-credit">

            </div>
        </main>
    </body>
